name: Build & Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Spice360
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_SUPABASE_AUTH_REDIRECT_URL: ${{ secrets.VITE_SUPABASE_AUTH_REDIRECT_URL }}
          VITE_MATRIXSALES_ADMIN_EMAILS: ${{ secrets.VITE_MATRIXSALES_ADMIN_EMAILS }}
        run: npm run build

      - name: Verify Supabase config in build output
        run: |
          echo "Checking that VITE_SUPABASE_URL was baked into the bundle..."
          grep -rl "supabase.co" dist/ | grep -q . || {
            echo "ERROR: supabase.co not found in dist/ — VITE_SUPABASE_URL was empty at build time."
            echo "Check that environment: Spice360 secrets are populated in GitHub."
            exit 1
          }
          echo "OK: supabase.co confirmed in build output."

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/
          # --prebuilt ignores vercel.json; routing must be declared here.
          # "handle": "filesystem" serves real files (assets, manifest.json, images)
          # first, then any unmatched path falls through to the SPA entry point so
          # deep links and hard reloads work instead of returning Vercel's 404.
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/.*", "dest": "/index.html" }
            ]
          }
          EOF
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" > deployment-url.txt
          echo "Deployed to $(cat deployment-url.txt)"

      - name: Verify deep links resolve (SPA fallback)
        run: |
          url=$(cat deployment-url.txt)
          fail=0
          for path in / /Dashboard /Purchasing /Finance; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url$path")
            echo "GET $path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "ERROR: a deep link did not return 200 — the SPA fallback in"
            echo ".vercel/output/config.json is missing or wrong. Opening any page"
            echo "in a new tab, reloading, or sharing a link would 404."
            exit 1
          fi
          echo "OK: deep links resolve."
